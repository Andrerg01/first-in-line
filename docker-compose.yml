services:
  postgres:
    image: postgres:16-alpine
    container_name: first_in_line_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-grand_openings}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # Fail fast rather than silently applying a weak default credential.
      # Copy .env.example to .env and set this value before running.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env (copy .env.example)}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-grand_openings}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: first_in_line_backend
    environment:
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-grand_openings}
      MCP_SERVER_URL: ${MCP_SERVER_URL:-http://mcp-server:9000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./config.toml:/app/config.toml:ro
    depends_on:
      postgres:
        condition: service_healthy
      mcp-server:
        condition: service_started
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    container_name: first_in_line_frontend
    depends_on:
      - backend-api
    ports:
      - "5173:80"

  mcp-server:
    build:
      context: ./mcp_server
    container_name: first_in_line_mcp
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-duckduckgo}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
    ports:
      - "9000:9000"

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: first_in_line_worker
    environment:
      APP_ENV: ${APP_ENV:-local}
      MCP_SERVER_URL: ${MCP_SERVER_URL:-http://mcp-server:9000}
      BACKEND_API_URL: ${BACKEND_API_URL:-http://backend-api:8000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONPATH: /workspace
      SCRAPER_TARGET_LOCATION: ${SCRAPER_TARGET_LOCATION:-}
      SCRAPER_MAX_RESULTS_PER_QUERY: ${SCRAPER_MAX_RESULTS_PER_QUERY:-}
      SCRAPER_DAILY_PAGE_LIMIT: ${SCRAPER_DAILY_PAGE_LIMIT:-}
      SCRAPER_RATE_LIMIT_SECONDS: ${SCRAPER_RATE_LIMIT_SECONDS:-}
      SCRAPER_LLM_PAGE_LIMIT: ${SCRAPER_LLM_PAGE_LIMIT:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      WORKER_REQUEST_TIMEOUT: ${WORKER_REQUEST_TIMEOUT:-}
      WORKER_BACKOFF_BASE: ${WORKER_BACKOFF_BASE:-}
      WORKER_MAX_RETRIES: ${WORKER_MAX_RETRIES:-}
      WORKER_CLASSIFY_MODEL: ${WORKER_CLASSIFY_MODEL:-}
      WORKER_EXTRACT_MODEL: ${WORKER_EXTRACT_MODEL:-}
    volumes:
      - ./config.toml:/workspace/config.toml:ro
    depends_on:
      postgres:
        condition: service_healthy
      mcp-server:
        condition: service_started
      backend-api:
        condition: service_started
    command: ["python", "-m", "worker.app.cli", "noop"]

volumes:
  postgres_data:
